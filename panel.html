<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel NEXTNIVEL</title>
<meta name="description" content="Vista de prueba del panel de NEXTNIVEL LCH con los datos actuales: solicitudes, ofertas y opiniones.">
<style>
:root{
  --bg:#0c1424; --panel:#141f35; --panel-2:#1a2843; --ink:#e8ecf4; --muted:#9aa6bb;
  --line:#26334d; --chip:#1a2843; --accent:#c9a24b; --navy:#13233f;
  --ok:#3cc488; --err:#ff7b6b; --shadow:0 12px 30px rgba(0,0,0,.35);
  --font:system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
.muted{color:var(--muted)} .sub{color:var(--muted);font-weight:400;font-size:14px}
.aviso{background:rgba(201,162,75,.12);border-bottom:1px solid var(--line);color:var(--accent);font-size:13px;padding:9px 16px;text-align:center}
header{position:sticky;top:0;z-index:5;background:var(--navy);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.brand .b{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#1a1405;display:grid;place-items:center;font-size:15px}
.brand i{color:var(--accent);font-style:normal}
#tabs{display:flex;gap:6px;max-width:1080px;margin:0 auto;padding:0 16px 12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 15px;font-size:14px;font-weight:600;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#1a1405}
.tab .n{opacity:.7;margin-left:4px}
main{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
.head{margin-bottom:16px}
.head h1{font-size:24px}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.lead{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin-bottom:12px}
.lead .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.lead .nm{font-size:17px;font-weight:800}
.lead .fecha{color:var(--muted);font-size:12.5px}
.jobs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tagj{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px}
.lead .row{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0 0;font-size:14px}
.lead .row span b{color:var(--muted);font-weight:600}
.lead .desc{margin:10px 0 0;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600;text-decoration:none;display:inline-flex;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1a1405}
.ofa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ofa-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.ofa-img{aspect-ratio:4/3;background:linear-gradient(135deg,#1a2843,#223354);display:grid;place-items:center;color:var(--muted);font-size:13px;position:relative}
.chip{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.st-on{background:rgba(60,196,136,.15);color:var(--ok)}
.ofa-b{padding:13px 15px;display:flex;flex-direction:column;gap:5px;flex:1}
.ofa-b b{font-size:16px}.ofa-b .pr{font-size:21px;font-weight:800;color:var(--accent)}
.ofa-b p{margin:0;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="aviso">🔎 Vista de prueba — muestra tus datos actuales. La versión que se actualiza sola (con login) se activa después.</div>
<header>
  <div class="bar"><div class="brand"><span class="b">NN</span>NEXT<i>NIVEL</i> LCH</div></div>
  <nav id="tabs"></nav>
</header>
<main id="view"></main>

<script>
const DATA={
  solicitudes:[
    {nombre:"EJEMPLO - María López",movil:"612 345 678",email:"maria@ejemplo.com",direccion:"Calle Sierpes 10, 2ºB",localidad:"Sevilla",cp:"41004",cuando:"En un mes · fianza 150 €",descripcion:"Quiero cambiar la bañera por plato de ducha.",trabajos:["Cambio de bañera por plato de ducha","Reformas de baños"],num_fotos:2,fecha:"hoy"}
  ],
  ofertas:[
    {titulo:"Reforma de baño completo",precio:"6.900 €",descripcion:"Demolición, fontanería, alicatado, plato de ducha y mampara.",orden:1,activo:true},
    {titulo:"Pintura de piso completo",precio:"desde 750 €",descripcion:"Paredes y techos, piso de 70-90 m², mano de obra y material.",orden:2,activo:true}
  ],
  opiniones:[]
};
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
const TABS=[["solicitudes","Solicitudes"],["ofertas","Ofertas"],["opiniones","Opiniones"]];
let view="solicitudes";
function tabs(){$("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab ${k===view?'on':''}" data-t="${k}">${l}<span class="n">${DATA[k].length}</span></button>`).join("");}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b){view=b.dataset.t;render();}});
function render(){tabs();({solicitudes:vSol,ofertas:vOf,opiniones:vOp}[view])();}
function vSol(){
  const d=DATA.solicitudes;
  $("#view").innerHTML=`<div class="head"><h1>Solicitudes <span class="sub">${d.length}</span></h1><p>Clientes que piden presupuesto desde la web.</p></div>`+(d.length?d.map(s=>`<div class="lead"><div class="top"><div class="nm">${esc(s.nombre)}</div><div class="fecha">${esc(s.fecha)}</div></div><div class="jobs">${s.trabajos.map(j=>`<span class="tagj">${esc(j)}</span>`).join("")}</div><div class="row"><span><b>Móvil:</b> ${esc(s.movil)}</span><span><b>Correo:</b> ${esc(s.email)}</span><span><b>Dónde:</b> ${esc(s.direccion)}, ${esc(s.localidad)} (${esc(s.cp)})</span><span><b>Cuándo:</b> ${esc(s.cuando)}</span><span><b>Fotos:</b> ${esc(s.num_fotos)}</span></div><div class="desc">${esc(s.descripcion)}</div><div class="acts"><a class="btn pri" href="https://wa.me/34${s.movil.replace(/\s/g,"")}" target="_blank" rel="noopener">WhatsApp</a><a class="btn" href="tel:+34${s.movil.replace(/\s/g,"")}">Llamar</a></div></div>`).join(""):`<div class="empty">Todavía no hay solicitudes.</div>`);
}
function vOf(){
  const d=DATA.ofertas;
  $("#view").innerHTML=`<div class="head"><h1>Ofertas <span class="sub">${d.length}</span></h1><p>Las ofertas visibles salen en la web, encima de la guía de precios.</p></div><div class="ofa-grid">${d.map(o=>`<div class="ofa-card"><div class="ofa-img"><span class="chip st-on"><i></i>Visible</span>Sin foto</div><div class="ofa-b"><b>${esc(o.titulo)}</b><span class="pr">${esc(o.precio)}</span><p>${esc(o.descripcion)}</p><p class="muted">Orden: ${esc(o.orden)}</p></div></div>`).join("")}</div>`;
}
function vOp(){
  $("#view").innerHTML=`<div class="head"><h1>Opiniones <span class="sub">0</span></h1><p>Reseñas enviadas por clientes desde la web.</p></div><div class="empty">Todavía no hay opiniones.</div>`;
}
render();
</script>
</body>
</html>
